--========================================================
-- DRAG SYSTEM
--========================================================

local dragging = false
local dragStart
local startPosition

local function updateDrag(input)
	local delta = input.Position - dragStart

	main.Position = UDim2.new(
		startPosition.X.Scale,
		startPosition.X.Offset + delta.X,
		startPosition.Y.Scale,
		startPosition.Y.Offset + delta.Y
	)
end

main.InputBegan:Connect(function(input)
	if input.UserInputType == Enum.UserInputType.MouseButton1 then
		dragging = true
		dragStart = input.Position
		startPosition = main.Position

		input.Changed:Connect(function()
			if input.UserInputState == Enum.UserInputState.End then
				dragging = false
			end
		end)
	end
end)

UIS.InputChanged:Connect(function(input)
	if dragging and input.UserInputType == Enum.UserInputType.MouseMovement then
		updateDrag(input)
	end
end)

local activeTab = nil

local function createTab(text, y, callback)
	local button = Instance.new("TextButton")
	button.Size = UDim2.new(1, -20, 0, 52)
	button.Position = UDim2.fromOffset(10, y)
	button.BackgroundColor3 = PANEL
	button.BorderSizePixel = 0
	button.Text = "   " .. text
	button.TextColor3 = MUTED
	button.Font = Enum.Font.GothamBold
	button.TextSize = 12
	button.TextXAlignment = Enum.TextXAlignment.Left
	button.AutoButtonColor = false
	button.Parent = sidebar

	corner(button, 10)

	local indicator = Instance.new("Frame")
	indicator.Size = UDim2.fromOffset(3, 26)
	indicator.Position = UDim2.fromOffset(4, 13)
	indicator.BackgroundColor3 = YELLOW
	indicator.BorderSizePixel = 0
	indicator.Visible = false
	indicator.Parent = button
	indicator.Name = "Indicator"

	corner(indicator, 3)

	button.MouseEnter:Connect(function()
		if activeTab ~= button then
			button.BackgroundColor3 = HOVER
			button.TextColor3 = TEXT
		end
	end)

	button.MouseLeave:Connect(function()
		if activeTab ~= button then
			button.BackgroundColor3 = PANEL
			button.TextColor3 = MUTED
		end
	end)

	button.MouseButton1Click:Connect(function()
		if activeTab then
			activeTab.BackgroundColor3 = PANEL
			activeTab.TextColor3 = MUTED

			local oldIndicator = activeTab:FindFirstChild("Indicator")

			if oldIndicator then
				oldIndicator.Visible = false
			end
		end

		activeTab = button
		button.BackgroundColor3 = BLUE_DARK
		button.TextColor3 = TEXT
		indicator.Visible = true

		callback()
	end)

	return button
end

	button.BorderSizePixel = 0
	button.TextColor3 = Color3.new(1, 1, 1)
	button.Font = Enum.Font.GothamBold
	button.TextSize = 10
	button.AutoButtonColor = false
	button.Parent = card

	corner(button, 15)

	local function refresh()
		button.Text = state and "ON" or "OFF"

		if state then
			button.BackgroundColor3 = BLUE
		else
			button.BackgroundColor3 = Color3.fromRGB(55, 60, 75)
		end
	end

	refresh()

	button.MouseButton1Click:Connect(function()
		state = not state
		refresh()
		callback(state)
	end)
end

--========================================================
-- ESP
--========================================================

local espObjects = {}

local function removeESP(player)
	local object = espObjects[player]

	if object then
		object:Destroy()
		espObjects[player] = nil
	end
end

local function addESP(player)
	if player == LP then
		return
	end

	if not ESP_ENABLED then
		return
	end

	local character = player.Character

	if not character then
		return
	end

	removeESP(player)

	local highlight = Instance.new("Highlight")
	highlight.Name = "NEON_ESP"
	highlight.Adornee = character
	highlight.DepthMode = Enum.HighlightDepthMode.AlwaysOnTop
	highlight.FillColor = getESPColor()
	highlight.OutlineColor = YELLOW
	highlight.FillTransparency = 0.45
	highlight.OutlineTransparency = 0.05
	highlight.Parent = character

	espObjects[player] = highlight
end

local function refreshESP()
	for _, player in ipairs(Players:GetPlayers()) do
		if player ~= LP then
			if ESP_ENABLED then
				addESP(player)
			else
				removeESP(player)
			end
		end
	end
end

--========================================================
-- VISUALS
--========================================================

local visualObjects = {}

local function clearVisuals(player)
	local objects = visualObjects[player]

	if objects then
		for _, object in ipairs(objects) do
			if object then
				object:Destroy()
			end
		end
	end

	visualObjects[player] = nil

local function getTarget()
	local camera = workspace.CurrentCamera

	if not camera then
		return nil
	end

	local center = Vector2.new(
		camera.ViewportSize.X / 2,
		camera.ViewportSize.Y / 2
	)

	local bestTarget = nil
	local bestDistance = AIM_FOV

	for _, player in ipairs(Players:GetPlayers()) do
		if player ~= LP then
			local character = player.Character

			if character then
				local humanoid = character:FindFirstChildOfClass("Humanoid")
				local head = character:FindFirstChild("Head")

				if humanoid
					and head
					and humanoid.Health > 0
				then
					local screenPosition, visible =
						camera:WorldToViewportPoint(head.Position)

					if visible and screenPosition.Z > 0 then
						local point = Vector2.new(
							screenPosition.X,
							screenPosition.Y
						)

						local distance =
							(point - center).Magnitude

						if distance < bestDistance then
							bestDistance = distance
							bestTarget = head
						end
					end
				end
			end
		end
	end

	return bestTarget
end

RunService:BindToRenderStep(
	"NEON_X_AIM",
	Enum.RenderPriority.Camera.Value + 1,
	function()
		if not AIM_ENABLED then
			return
		end

		local camera = workspace.CurrentCamera

		if not camera then
			return
		end

		local target = getTarget()

		if target then
			local look = CFrame.lookAt(
				camera.CFrame.Position,
				target.Position
			)

			camera.CFrame = camera.CFrame:Lerp(
				look,
				AIM_SMOOTH
			)
		end
	end
)

UIS.InputBegan:Connect(function(input, processed)
	if input.UserInputType ~= Enum.UserInputType.Keyboard then
		return
	end

	if waitingForAimKey then
		if input.KeyCode ~= Enum.KeyCode.Unknown
			and input.KeyCode ~= Enum.KeyCode.Z
		then
			AIM_KEY = input.KeyCode
			waitingForAimKey = false
			showAIM()
		end

		return
	end

	if input.KeyCode == AIM_KEY and not processed then
		AIM_ENABLED = not AIM_ENABLED
	end

	if input.KeyCode == Enum.KeyCode.Z then
		main.Visible = not main.Visible
	end
end)

RunService.RenderStepped:Connect(function(dt)

	-- FPS
	if FPS_ENABLED then
		frames += 1
		fpsTimer += dt

		if fpsTimer >= 0.5 then
			currentFPS =
				math.floor(
					frames / fpsTimer + 0.5
				)

			if currentFPS < 0 then
				currentFPS = 0
			end

			fpsText.Text = "FPS  " .. currentFPS

			frames = 0
			fpsTimer = 0
		end
	end

	-- FOV position
	local camera = workspace.CurrentCamera

	if not camera then
		return
	end

	fov.Position =
		UDim2.fromOffset(
			camera.ViewportSize.X / 2,
			camera.ViewportSize.Y / 2
		)

	-- Distance
	if DISTANCE_TEXT then
		local myCharacter = LP.Character

		local myRoot =
			myCharacter
			and myCharacter:FindFirstChild("HumanoidRootPart")

		if myRoot then
			for player, objects in pairs(visualObjects) do
				if player.Character then
					local head =
						player.Character:FindFirstChild("Head")

					if head then
						local distance =
							math.floor(
								(
									myRoot.Position
									- head.Position
								).Magnitude
							)

						for _, object in ipairs(objects) do
							local label =
								object:FindFirstChild("Distance")

							if label then
								label.Text =
									distance .. " studs"
							end
						end
					end
				end
			end
		end
	end

	-- Tracers
	if TRACERS then
		local center =
			Vector2.new(
				camera.ViewportSize.X / 2,
				camera.ViewportSize.Y / 2
			)

		for player, line in pairs(tracerObjects) do
			local character = player.Character

			if character then
				local head =
					character:FindFirstChild("Head")

				if head then
					local position, visible =
						camera:WorldToViewportPoint(
							head.Position
						)

					if visible and position.Z > 0 then
						local target =
							Vector2.new(
								position.X,
								position.Y
							)

						local direction =
							target - center

						local length =
							direction.Magnitude

						line.Visible = true

						line.Size =
							UDim2.fromOffset(
								2,
								length
							)

						line.Position =
							UDim2.fromOffset(
								(center.X + target.X) / 2,
								(center.Y + target.Y) / 2
							)

						line.Rotation =
							math.deg(
								math.atan2(
									direction.Y,
									direction.X
								)
							) + 90

						line.BackgroundColor3 =
							getESPColor()
					else
						line.Visible = false
					end
				end
			end
		end
	end
end)

    const textarea =
        document.getElementById("scriptCode");

    textarea.select();
    textarea.setSelectionRange(
        0,
        textarea.value.length
    );

    navigator.clipboard.writeText(
        textarea.value
    ).then(() => {

        showToast("Скрипт скопирован!");

    }).catch(() => {

        showToast("Скрипт скопирован!");

    });

    const blob =

            [code],
            {

            }
        );

    const url =
        URL.createObjectURL(blob);

    const link =
        document.createElement("a");

    link.href = url;
    link.download = "NeonX_UA.lua";

    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);

    setTimeout(() => {
        URL.revokeObjectURL(url);
    }, 1000);

    showToast("NeonX_UA.lua скачан!");
